name: Build Atelie Roseli Android APK
on:
  push:
    branches: [atelie-roseli-android-apk]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build and record diagnostic status
        shell: bash
        run: |
          set +e
          gradle -p android-roseli assembleDebug --stacktrace --no-daemon > /tmp/roseli-build.log 2>&1
          CODE=$?
          tail -130 /tmp/roseli-build.log
          if [ "$CODE" -eq 0 ]; then
            printf 'BUILD SUCCESSFUL\n' > android-roseli/build-diagnostic.txt
          else
            printf 'BUILD FAILED: exit %s\n\n' "$CODE" > android-roseli/build-diagnostic.txt
            tail -130 /tmp/roseli-build.log >> android-roseli/build-diagnostic.txt
          fi
          git config user.name 'roseli-android-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add android-roseli/build-diagnostic.txt
          git commit -m '[skip ci] Android APK build status' || true
          git push || true
          exit "$CODE"
      - uses: actions/upload-artifact@v4
        with:
          name: Atelie-Roseli-Android-APK
          path: android-roseli/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

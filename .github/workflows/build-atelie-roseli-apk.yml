name: Build Atelie Roseli Android APK
on:
  push:
    branches: [atelie-roseli-android-apk]
    paths-ignore:
      - android-roseli/BUILD_STATUS.md
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK on runner
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile with captured log
        id: compile
        shell: bash
        run: |
          set +e
          gradle -p android-roseli assembleDebug --stacktrace --no-daemon > "$RUNNER_TEMP/roseli-build.log" 2>&1
          result=$?
          tail -n 110 "$RUNNER_TEMP/roseli-build.log"
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload APK on success
        if: steps.compile.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: Atelie-Roseli-Android-APK
          path: android-roseli/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Save build diagnostics to repository
        if: always()
        shell: bash
        run: |
          mkdir -p android-roseli
          {
            echo '# Resultado da compilação Android'
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Exit code: ${{ steps.compile.outputs.exit_code }}"
            echo "Workflow URL: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo '## Final do log'
            echo '~~~'
            if [ -f "$RUNNER_TEMP/roseli-build.log" ]; then tail -n 90 "$RUNNER_TEMP/roseli-build.log"; else echo 'Build step did not execute'; fi
            echo '~~~'
          } > android-roseli/BUILD_STATUS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-roseli/BUILD_STATUS.md
          git commit -m "Record Android APK build status [skip ci]" || true
          git push || true

<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Laurinha Kids • Mundo Mágico</title><style>*{box-sizing:border-box}body{margin:0;background:#f4eaff;font:700 16px system-ui;color:#50366d}main{max-width:500px;margin:auto;padding:20px 16px 100px}header{display:flex;justify-content:space-between;align-items:center;color:#8353d8}h1{font-size:32px;letter-spacing:-2px;margin:0}h2{font-size:26px}button{border:0;border-radius:20px;background:white;color:#50366d;font:800 16px system-ui;padding:16px;box-shadow:0 5px 0 #d9c9ef;touch-action:manipulation}button:active{transform:translateY(4px);box-shadow:none}.primary{background:#8554e9;color:white;width:100%;box-shadow:0 5px 0 #6335bf;margin-top:15px}.scene{height:300px;border-radius:30px;position:relative;overflow:hidden;background:radial-gradient(circle at 80% 15%,#fff5ad 0 8%,transparent 9%),linear-gradient(#a9d9ff,#e9d4ff 70%,#a7dfae 70%);display:grid;place-items:center}.pet{width:155px;height:155px;object-fit:contain;animation:bob 1.8s infinite ease-in-out;font-size:110px;text-align:center}@keyframes bob{50%{transform:translateY(-18px) rotate(6deg)}}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:white;padding:10px 4px calc(10px + env(safe-area-inset-bottom));gap:8px}nav button{font-size:13px;box-shadow:none;padding:10px}canvas{width:100%;background:white;border-radius:25px;touch-action:none}.colors{display:flex;justify-content:space-between;margin:15px 0}.colors button{width:34px;height:34px;border:3px solid white;border-radius:50%;padding:0}.star{position:absolute;background:transparent;box-shadow:none;font-size:43px;padding:0}progress{accent-color:#e67db7;width:65%}</style><main><header><h1>laurinha<span style="color:#ee85af">kids.</span></h1><span>⭐ <b id="coins">0</b></span></header><p style="letter-spacing:3px;font-size:11px">MUNDO MÁGICO</p><section id="view"></section></main><nav><button onclick="page('home')">🏡<br>Início</button><button onclick="page('draw')">🎨<br>Desenhar</button><button onclick="page('pet')">💗<br>Bichinho</button><button onclick="page('game')">🎮<br>Jogar</button></nav><script>let pet='',coins=0,score=0,ink='#8353d8',size=10,food=65,happy=65;try{pet=localStorage.pet||'';coins=+(localStorage.coins||0)}catch(e){}const v=document.querySelector('#view');function award(n){coins+=n;document.querySelector('#coins').textContent=coins;try{localStorage.coins=coins}catch(e){}}function scene(){return '<div class="scene"><span style="position:absolute;top:18px;left:20px;font-size:45px">☁️</span><span style="position:absolute;bottom:10px;left:15px;font-size:50px">🌷</span><span style="position:absolute;bottom:12px;right:15px;font-size:65px">🌳</span>'+(pet?'<img class="pet" src="'+pet+'">':'<span class="pet">🐰</span>')+'</div>'}function page(p){if(p==='home')v.innerHTML='<h2>Qual aventura vamos viver?</h2>'+scene()+'<button class="primary" onclick="page(\'draw\')">✨ Criar meu personagem</button><div class="grid"><button onclick="page(\'pet\')">💗 Cuidar</button><button onclick="page(\'game\')">🌟 Caçar estrelas</button></div>';if(p==='draw'){v.innerHTML='<h2>Ateliê mágico</h2><p>Desenhe seu amigo com o dedo!</p><canvas id="paper" width="600" height="480"></canvas><div class="colors">'+['#49316d','#a56be9','#ff78a8','#ffad42','#ffdb53','#44c99c','#58a8f4','#ef5350'].map(c=>'<button style="background:'+c+'" onclick="ink=\''+c+'\'"></button>').join('')+'</div><div class="grid"><button onclick="ink=\'erase\'">Borracha</button><button onclick="document.querySelector(\'#paper\').getContext(\'2d\').clearRect(0,0,600,480)">Limpar</button></div><button class="primary" onclick="alive()">🪄 Dar vida!</button>';let c=document.querySelector('#paper'),x=c.getContext('2d'),down=false;function pos(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*600/r.width,(e.clientY-r.top)*480/r.height]}c.onpointerdown=e=>{e.preventDefault();down=true;c.setPointerCapture(e.pointerId);let [a,b]=pos(e);x.beginPath();x.moveTo(a,b);x.lineTo(a+.1,b+.1);paint()};function paint(){x.globalCompositeOperation=ink==='erase'?'destination-out':'source-over';x.strokeStyle=ink==='erase'?'black':ink;x.lineWidth=ink==='erase'?30:size;x.lineCap='round';x.lineJoin='round';x.stroke()}c.onpointermove=e=>{if(!down)return;let [a,b]=pos(e);x.lineTo(a,b);paint();x.beginPath();x.moveTo(a,b)};c.onpointerup=c.onpointercancel=()=>down=false}if(p==='pet')v.innerHTML='<h2>Meu melhor amigo</h2>'+scene()+'<p id="msg">Vamos brincar!</p><p>🍓 <progress id="food" max="100" value="'+food+'"></progress></p><p>💗 <progress id="happy" max="100" value="'+happy+'"></progress></p><div class="grid"><button onclick="care(0)">🍎 Alimentar</button><button onclick="care(1)">🫧 Banho</button><button onclick="care(2)">💕 Abraçar</button><button onclick="care(3)">🎵 Dançar</button></div>';if(p==='game'){score=0;v.innerHTML='<h2>Caça às estrelas</h2><p>Encontre 10 estrelas! <b id="score">0/10</b></p>'+scene()+'<p id="win"></p>';spawn()}}function alive(){let c=document.querySelector('#paper');if(!c.getContext('2d').getImageData(0,0,600,480).data.some((n,i)=>i%4===3&&n))return alert('Desenhe primeiro!');pet=c.toDataURL();try{localStorage.pet=pet}catch(e){}award(5);page('pet')}function care(i){if(i===0)food=Math.min(100,food+15);else happy=Math.min(100,happy+10);document.querySelector('#food').value=food;document.querySelector('#happy').value=happy;document.querySelector('#msg').textContent=['Que delícia!','Estou cheirosinho!','Adorei o abraço!','Vamos dançar!'][i];award(1)}function spawn(){let b=document.createElement('button');b.className='star';b.textContent='⭐';b.style.left=(5+Math.random()*73)+'%';b.style.top=(5+Math.random()*65)+'%';document.querySelector('.scene').appendChild(b);b.onclick=()=>{b.remove();score++;award(1);document.querySelector('#score').textContent=score+'/10';if(score===10){award(10);document.querySelector('#win').textContent='🏆 Parabéns! Missão concluída!'}else spawn()}}award(0);page('home');</script></html>

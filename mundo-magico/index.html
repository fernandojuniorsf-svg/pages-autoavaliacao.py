.huntboard{position:relative;height:clamp(280px,52dvh,500px);overflow:hidden;border-radius:23px;isolation:isolate;touch-action:manipulation;background:linear-gradient(155deg,#f6d9ab,#e6a9b4);box-shadow:0 6px 0 #100c28}.huntitem{position:absolute;display:grid;place-items:center;transform:translate(-50%,-50%);padding:0;border:0;background:transparent;box-shadow:none;line-height:1;touch-action:manipulation;filter:drop-shadow(1px 2px 1px #563b4633)}.huntitem:active{transform:translate(-50%,-50%) scale(.9)}.huntitem.found{visibility:hidden}.huntitem.wrong{animation:shake .2s}@keyframes shake{50%{margin-left:5px}}.hunttarget{display:flex;align-items:center;gap:12px;background:#443767;padding:10px;border-radius:20px;margin:8px 0}.hunttarget .symbol{font-size:44px;background:#fff4d8;border-radius:15px;padding:4px 10px}.huntclock{font-size:26px;color:#ffda76;font-variant-numeric:tabular-nums}.huntclock.danger{color:#ff9eab}.hunttimer{height:9px;background:#342851;border-radius:9px;overflow:hidden;margin:9px 0}.hunttimer i{display:block;background:#ffcd69;height:100%;width:100%}.huntboard .overlay{z-index:999}.huntfloor{position:absolute;inset:0;pointer-events:none;opacity:.3;background:repeating-linear-gradient(45deg,transparent 0 38px,#fff7 39px 42px,transparent 43px 80px)}.huntboard button:focus-visible{outline:2px solid white}.huntintro{background:linear-gradient(145deg,#b45fc4,#6246ab);border-radius:26px;padding:20px;margin-top:15px}body.playing main,body.hunting main{max-width:860px;padding:8px 6px max(10px,env(safe-area-inset-bottom))}body.playing header,body.hunting header{padding:0 6px}body.playing .stage{border-radius:16px}body.playing .stage canvas{max-height:none!important;height:auto;object-fit:contain}body.playing .hud{padding:5px 4px}body.playing .mission{margin:5px 0;padding:8px 10px;font-size:13px}body.playing .controls{margin:9px 10px 0}body.hunting .huntboard{height:clamp(265px,calc(100dvh - 220px),760px);border-radius:16px}body.hunting .hunttarget{margin:5px 0;padding:7px 10px}body.hunting .hunttimer{margin:5px 0}body.hunting .huntitem{font-size:clamp(24px,7.8vw,48px)}@media(min-width:700px){body.playing main{max-width:680px}} </style></head><body><main><header><h1>laurinha<b>kids.</b></h1><button class="topbtn" id="sound">🔊 Som</button><span>⭐ <b id="coins">0</b></span></header><section id="view"></section></main><script>

const V=document.querySelector('#view'),$=s=>document.querySelector(s);

function unlockAudio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function tone(f=520,d=.12,delay=0){if(muted)return;try{unlockAudio();let o=ac.createOscillator(),a=ac.createGain(),t=ac.currentTime+delay;o.type='sine';o.frequency.setValueAtTime(f,t);a.gain.setValueAtTime(.0001,t);a.gain.exponentialRampToValueAtTime(.10,t+.015);a.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(a);a.connect(ac.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}

$('#sound').onclick=()=>{unlockAudio();muted=!muted;$('#sound').textContent=muted?'🔇 Som':'🔊 Som';if(muted){try{speechSynthesis.cancel()}catch(e){}}else{tone();say('Vamos brincar!')}};
const levels=[
{n:'Bosque das Estrelas',icon:'🌳',item:'⭐',npc:'🦉',desc:'Encontre 5 estrelas e leve para a coruja.',need:5,ground:'#86c99a',dark:'#70b88a',water:'#68b8df',tree:'🌳',ob:'🪨',en:'🐝'},
{n:'Ilha dos Doces',icon:'🍭',item:'🍓',npc:'🐰',desc:'Colha 6 morangos para o piquenique do coelho.',need:6,ground:'#f2b6cf',dark:'#e99cbf',water:'#a0b8f4',tree:'🍭',ob:'🧁',en:'🐝'},
{n:'Reino das Nuvens',icon:'☁️',item:'💎',npc:'🦄',desc:'Recupere 7 cristais perdidos e encontre o unicórnio.',need:7,ground:'#bdc8f8',dark:'#a8b6ef',water:'#889bdc',tree:'☁️',ob:'🌈',en:'🌪️'},
{n:'Vale dos Dinossauros',icon:'🦕',item:'🥚',npc:'🦕',desc:'Resgate 8 ovos e devolva à mamãe dinossauro.',need:8,ground:'#a5ce80',dark:'#8fbd70',water:'#6ab3b4',tree:'🌴',ob:'🪨',en:'🦋'},
{n:'Planeta da Lua',icon:'🚀',item:'🌟',npc:'👽',desc:'Reúna 9 estrelas cósmicas para consertar o foguete.',need:9,ground:'#a799d5',dark:'#9382c6',water:'#62558c',tree:'🪐',ob:'☄️',en:'🛸'},
{n:'Castelo dos Sonhos',icon:'🏰',item:'🔑',npc:'👸',desc:'Ache 10 chaves mágicas para abrir o castelo dos sonhos.',need:10,ground:'#edc6e8',dark:'#daa7d5',water:'#9dbde8',tree:'🌸',ob:'🏰',en:'🦇'}];
function stop(){clearInterval(huntInterval);huntInterval=0;active=false;cancelAnimationFrame(raf);keys={};document.body.classList.remove('drawing','playing','hunting')}
function home(){stop();V.innerHTML='<div class="hero"><small>AVENTURA DOS RABISCOS</small><div class="art">'+(saved.pet?'<img src="'+saved.pet+'">':'🐰')+'</div><h2>Seu desenho. Seu mundo.</h2><p>Crie um herói e explore seis reinos mágicos!</p><button class="primary" id="play">▶ '+(saved.level?'Continuar aventura':'Começar aventura')+'</button></div><div class="cards"><button class="tile" id="draw"><span>🎨</span>Ateliê de heróis</button><button class="tile" id="map"><span>🗺️</span>Mapa dos mundos</button><button class="tile" id="hunt" style="grid-column:1/-1;background:linear-gradient(120deg,#a55bc7,#7051c7)"><span>🔎</span>Desafio dos 100 objetos · 10 segundos</button></div><p style="text-align:center;color:#d4c6f4"> '+Math.min(saved.level,6)+' de 6 missões concluídas</p>';$('#play').onclick=()=>{unlockAudio();if(!saved.pet)draw();else start(Math.min(saved.level,5))};$('#draw').onclick=draw;$('#map').onclick=map;$('#hunt').onclick=huntHome}
function map(){stop();V.innerHTML='<h2>Mapa mágico</h2><p>Complete uma missão para abrir a próxima!</p>'+levels.map((l,i)=>'<button class="world" data-i="'+i+'" '+(i>saved.level?'disabled':'')+'><span>'+l.icon+'</span><div>'+l.n+'<small>'+ (i<saved.level?'Concluída ★★★':i>saved.level?'🔒 Bloqueado':l.desc)+'</small></div></button>').join('')+'<button class="primary" id="back">Voltar ao início</button>';V.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>saved.pet?start(+b.dataset.i):draw());$('#back').onclick=home}
function draw(){stop();document.body.classList.add('drawing');V.innerHTML='<h2>Crie seu herói!</h2><p>Desenhe com o dedo. Ele vai andar no mundo mágico!</p><canvas class="paper" id="paper" width="600" height="480"></canvas><div class="palette">'+['#382447','#9a58e9','#ff76ae','#ffad42','#ffda42','#46c99b','#54a7ff','#ed4545'].map(c=>'<button data-color="'+c+'" style="background:'+c+'"></button>').join('')+'</div><div class="cards"><button id="erase">Borracha</button><button id="clear">Limpar</button></div><button class="primary" id="alive">✨ Dar vida e jogar</button><button class="topbtn" id="back">← Voltar</button>';let c=$('#paper'),ctx=c.getContext('2d'),ink='#9a58e9',down=false;ctx.lineCap=ctx.lineJoin='round';function pos(e){let r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}function paint(){ctx.globalCompositeOperation=ink==='erase'?'destination-out':'source-over';ctx.strokeStyle=ink==='erase'?'black':ink;ctx.lineWidth=ink==='erase'?38:12;ctx.stroke()}c.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});c.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});c.onpointerdown=e=>{e.preventDefault();down=true;try{c.setPointerCapture(e.pointerId)}catch(e){}let [x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+.1,y+.1);paint()};c.onpointermove=e=>{if(!down)return;e.preventDefault();let[x,y]=pos(e);ctx.lineTo(x,y);paint();ctx.beginPath();ctx.moveTo(x,y)};c.onpointerup=c.onpointercancel=()=>down=false;V.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{ink=b.dataset.color;tone(650)});$('#erase').onclick=()=>ink='erase';$('#clear').onclick=()=>ctx.clearRect(0,0,600,480);$('#back').onclick=home;$('#alive').onclick=()=>{let d=ctx.getImageData(0,0,600,480).data,minX=600,minY=480,maxX=0,maxY=0;for(let y=0;y<480;y++)for(let x=0;x<600;x++)if(d[(y*600+x)*4+3]>20){minX=Math.min(x,minX);maxX=Math.max(x,maxX);minY=Math.min(y,minY);maxY=Math.max(y,maxY)}if(minX>maxX){say('Desenhe seu personagem primeiro!');return}let crop=document.createElement('canvas');crop.width=maxX-minX+21;crop.height=maxY-minY+21;crop.getContext('2d').drawImage(c,minX,minY,maxX-minX+1,maxY-minY+1,10,10,maxX-minX+1,maxY-minY+1);saved.pet=crop.toDataURL();petImg.src=saved.pet;save();tone(660);tone(880,.2,.12);start(Math.min(saved.level,5))}}
const W=960,H=640,CW=480;let CH=340;
function start(i){stop();unlockAudio();document.body.classList.add('playing');let l=levels[i];V.innerHTML='<div class="hud"><button class="topbtn" id="back">← Mapa</button><span class="pill">FASE '+(i+1)+'/6</span><span class="pill" id="hp">💗💗💗</span></div><div class="mission"><b>'+l.icon+' '+l.n+'</b><div id="objective">'+l.desc+'</div><div class="meter"><i id="meter" style="width:0%"></i></div></div><div class="stage" id="stage"><canvas id="game" width="480" height="340"></canvas></div><div class="hud"><span id="count">'+l.item+' 0/'+l.need+'</span><span id="hint">Explore o mapa!</span></div><div class="controls"><div class="dpad"><button data-key="up">▲</button><button data-key="left">◀</button><button data-key="down">▼</button><button data-key="right">▶</button></div><button class="action" id="jump">⬆<br>PULAR</button></div>';$('#back').onclick=map;const gameCanvas=$('#game');function fitGame(){const w=gameCanvas.getBoundingClientRect().width||window.innerWidth-12;const available=Math.max(220,window.innerHeight-245);CH=Math.round(Math.min(640,Math.max(260,available*CW/w)));gameCanvas.height=CH;}fitGame();g={i,l,c:$('#game'),ctx:$('#game').getContext('2d'),x:75,y:320,hp:3,lastHit:-10,t:0,jump:0,got:0,particles:[],items:[],obs:[],trees:[],enemies:[],npc:{x:880,y:320},last:0};for(let k=0;k<l.need;k++){let col=k%4,row=Math.floor(k/4);g.items.push({x:185+col*190+(row%2)*35,y:125+row*190+(col%2)*55,got:false})}for(let k=0;k<12;k++){g.obs.push({x:260+(k%4)*145,y:70+Math.floor(k/4)*205,r:20})}for(let k=0;k<20;k++){g.trees.push({x:35+(k*163)%900,y:k%2?35:605})}for(let k=0;k<3+i%3;k++)g.enemies.push({x:350+k*110,y:245+(k%2)*195,base:350+k*110,phase:k*2});V.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.onpointerdown=e=>{e.preventDefault();keys[k]=true;try{b.setPointerCapture(e.pointerId)}catch(e){}};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys[k]=false});$('#jump').onpointerdown=e=>{e.preventDefault();jump()};let drag=null;g.c.onpointerdown=e=>{e.preventDefault();try{g.c.setPointerCapture(e.pointerId)}catch(e){}drag={x:e.clientX,y:e.clientY}};g.c.onpointermove=e=>{if(!drag)return;e.preventDefault();let dx=e.clientX-drag.x,dy=e.clientY-drag.y;keys.left=dx<-12;keys.right=dx>12;keys.up=dy<-12;keys.down=dy>12};g.c.onpointerup=g.c.onpointercancel=()=>{drag=null;keys={}};active=true;say(l.desc);raf=requestAnimationFrame(loop)}
function jump(){if(active&&g.jump<=0){g.jump=.65;tone(380);tone(650,.1,.05)}}
window.addEventListener('keydown',e=>{let k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'}[e.key];if(active&&(k||e.code==='Space')){e.preventDefault();if(k)keys[k]=true;else jump()}});window.addEventListener('keyup',e=>{let k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'}[e.key];if(k)keys[k]=false});window.addEventListener('blur',()=>keys={});
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

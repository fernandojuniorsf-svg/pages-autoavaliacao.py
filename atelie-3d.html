:12;top:220px;left:465px;width:565px;border:7px solid #fff;border-radius:45px;background:linear-gradient(135deg,#fff,#fff2fa);box-shadow:0 10px 0 #af74c0,0 14px 28px #62286677;padding:22px;color:#8b268e;text-align:center;font:bold 37px Arial;display:none}.toast.show{display:block}.effect{position:absolute;z-index:10;pointer-events:none;font-size:64px;animation:rise 1.5s ease-out forwards}@keyframes rise{0%{opacity:0;transform:translateY(25px) scale(.5)}30%{opacity:1}100%{opacity:0;transform:translateY(-130px) scale(1.3)}}#characterFx{position:absolute;left:340px;top:110px;width:540px;height:690px;pointer-events:none;z-index:3;border-radius:60%;opacity:0;transition:opacity .3s;background:radial-gradient(ellipse,transparent 55%,#fff7 70%,transparent 74%)}#characterFx.alive{opacity:1;animation:glow 1.5s ease-in-out infinite}@keyframes glow{50%{filter:drop-shadow(0 0 28px #fff);transform:translateY(-6px)}}#print{position:absolute;z-index:9;left:1285px;top:745px;display:none;border:0;border-radius:26px;background:#fff;padding:13px;font:700 27px Arial;color:#922797;box-shadow:0 6px 0 #b47acd}#status{position:absolute;z-index:12;left:455px;top:730px;border-radius:30px;background:#fff;border:4px solid #ff8bc5;padding:14px 25px;font:700 24px Arial;color:#862d88;display:none}@media(prefers-reduced-motion:reduce){.effect,#characterFx.alive{animation:none}}

(()=>{'use strict';const W=1672,H=941,stage=document.getElementById('stage'),draw=document.getElementById('draw'),ctx=draw.getContext('2d'),toast=document.getElementById('toast'),status=document.getElementById('status'),fx=document.getElementById('characterFx');let scale=1,rotated=false,color='#ff39ab',size=21,painting=false,tool='brush',decors=[],accessory='laço',undo=[];const pos=(event,element=stage)=>{let m=new DOMMatrix(getComputedStyle(stage).transform);let p=new DOMPoint(event.clientX,event.clientY).matrixTransform(m.inverse());return {x:p.x,y:p.y}};
function layout(){const vw=innerWidth,vh=innerHeight;rotated=vh>vw;scale=rotated?Math.min(vh/W,vw/H):Math.min(vw/W,vh/H);if(rotated){let x=(vw+H*scale)/2,y=(vh-W*scale)/2;stage.style.transform=`translate(${x}px,${y}px) rotate(90deg) scale(${scale})`;}else{let x=(vw-W*scale)/2,y=(vh-H*scale)/2;stage.style.transform=`translate(${x}px,${y}px) scale(${scale})`;}}
addEventListener('resize',layout);addEventListener('orientationchange',layout);layout();document.addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault()},{passive:false});document.addEventListener('gesturestart',e=>e.preventDefault());
function hotspot(x,y,w,h,label,fn){let b=document.createElement('button');b.className='hotspot';b.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;b.setAttribute('aria-label',label);b.onclick=fn;stage.appendChild(b);return b;}
const palette=['#ff64bf','#f83c44','#ff886f','#ffb428','#82e93d','#49c9ef','#2478e8','#a83ce7','#ec2fd5','#e8a221'];palette.forEach((c,i)=>{const x=i%2?1540:1490,y=250+Math.floor(i/2)*53;let b=document.createElement('button');b.className='paintdot';b.style.left=x+'px';b.style.top=y+'px';b.setAttribute('aria-label','Selecionar cor '+c);b.onclick=()=>{color=c;tool='brush';document.querySelectorAll('.paintdot').forEach(d=>d.classList.remove('active'));b.classList.add('active')};stage.appendChild(b)});
function clipDress(){ctx.beginPath();ctx.moveTo(120,22);ctx.lineTo(275,40);ctx.bezierCurveTo(324,36,360,76,401,112);ctx.lineTo(667,365);ctx.bezierCurveTo(690,390,677,435,620,480);ctx.bezierCurveTo(480,540,315,590,185,558);ctx.bezierCurveTo(97,555,38,489,20,438);ctx.lineTo(150,218);ctx.closePath();}
function canvasPoint(e){let p=pos(e);return {x:(p.x-1089)*2,y:(p.y-252)*2}}
function drawAt(e,start){let p=canvasPoint(e);ctx.save();clipDress();ctx.clip();ctx.strokeStyle=color;ctx.lineWidth=size*2;ctx.lineJoin='round';ctx.lineCap='round';if(start){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.1,p.y+.1);}else ctx.lineTo(p.x,p.y);ctx.stroke();ctx.restore();}
function addDecoration(e){let p=pos(e);let s=document.createElement('div');s.className='overlay';s.style.cssText=`left:${p.x-22}px;top:${p.y-23}px;font-size:49px`;s.textContent=tool==='heart'?'💖':tool==='star'?'⭐':tool==='flower'?'🌸':'🦋';stage.append(s);decors.push(s);s.animate([{transform:'scale(.2) rotate(-30deg)'},{transform:'scale(1.2)'},{transform:'scale(1)'}],{duration:360});}
draw.addEventListener('pointerdown',e=>{e.preventDefault();if(tool!=='brush'){addDecoration(e);return}painting=true;draw.setPointerCapture(e.pointerId);undo.push(ctx.getImageData(0,0,draw.width,draw.height));drawAt(e,true)});draw.addEventListener('pointermove',e=>{if(painting){e.preventDefault();drawAt(e,false)}});const end=()=>{painting=false;ctx.beginPath()};draw.addEventListener('pointerup',end);draw.addEventListener('pointercancel',end);
function show(msg,ms=2100){toast.textContent=msg;toast.classList.add('show');clearTimeout(show.t);show.t=setTimeout(()=>toast.classList.remove('show'),ms)}
function talk(msg){show(msg,3000);if('speechSynthesis' in window){try{speechSynthesis.cancel();let s=new SpeechSynthesisUtterance(msg);s.lang='pt-BR';s.rate=1.03;s.pitch=1.22;speechSynthesis.speak(s)}catch(e){}}}
function confetti(n=24){for(let i=0;i<n;i++){const s=document.createElement('div');s.className='effect';s.style.left=(450+Math.random()*620)+'px';s.style.top=(390+Math.random()*300)+'px';s.textContent=['✨','💖','⭐','🌸'][i%4];stage.append(s);setTimeout(()=>s.remove(),1550)}}
function life(){fx.classList.add('alive');confetti();talk(['Uau! Você criou um vestido maravilhoso!','Amei essas cores! Que criatividade!','Ficou lindo! Você é uma artista!'][Math.floor(Math.random()*3)]);setTimeout(()=>fx.classList.remove('alive'),3600)}
function desfile(){fx.classList.add('alive');confetti(36);talk('Olha meu desfile! Estou me sentindo uma estrela!');stage.animate([{filter:'brightness(1)'},{filter:'brightness(1.17)'},{filter:'brightness(1)'},{filter:'brightness(1.13)'},{filter:'brightness(1)'}],{duration:3400});setTimeout(()=>fx.classList.remove('alive'),3800)}
function reset(){ctx.clearRect(0,0,draw.width,draw.height);decors.forEach(d=>d.remove());decors=[];tool='brush';show('Vestido limpinho! Vamos criar outra roupa!')}
function undoLast(){if(decors.length){decors.pop().remove()}else if(undo.length){ctx.putImageData(undo.pop(),0,0)}show('Última mudança desfeita!',1000)}

hotspot(1088,557,102,100,'Pincel',()=>{tool='brush';show('Agora pode pintar o vestido!')});hotspot(1196,560,84,82,'Balde de tinta',()=>{tool='brush';show('Escolha uma cor e pinte!')});hotspot(1288,564,84,76,'Coração',()=>{tool='heart';show('Toque no vestido para colocar corações!')});hotspot(1370,558,88,83,'Estrela',()=>{tool='star';show('Toque no vestido para colocar estrelas!')});hotspot(1460,558,88,83,'Flor',()=>{tool='flower';show('Toque no vestido para colocar flores!')});
hotspot(1097,676,435,57,'Tamanho do pincel',e=>{});stage.addEventListener('pointerdown',e=>{let p=pos(e);if(p.x>1110&&p.x<1525&&p.y>672&&p.y<742){size=8+Math.round((p.x-1110)/415*42);show('Pincel ajustado!',900)}},{passive:true});hotspot(180,795,205,111,'Limpar',reset);hotspot(407,795,205,111,'Refazer',undoLast);hotspot(650,797,365,115,'Dar vida',life);hotspot(1030,795,280,110,'Desfilar',desfile);hotspot(1320,795,304,110,'Tirar foto',()=>{talk('Você pode tirar uma foto da sua criação com o celular!')});hotspot(18,797,155,115,'Início',()=>show('Você está no Ateliê da Laurinha!'));

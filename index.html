a',fashion))}));}function adventure(){jump=0;level=1;run()}function run(){const r=clear('Aventura Encantada',`Fase ${level} • pule 6 obstáculos`),area=node('div','playfield'),sprite=new Image();sprite.src=LAURA;sprite.className='runner';const obstacle=node('div','block','🌵');area.append(sprite,obstacle);r.append(area);const counter=node('div','score',`Obstáculos ${jump}/6`);r.append(counter,button('⬆️ PULAR!',()=>{sprite.style.bottom='56%';setTimeout(()=>sprite.style.bottom='22%',250);jump++;gain();counter.textContent=`Obstáculos ${jump}/6`;obstacle.textContent=['🌵','🪨','🍄','🌸'][jump%4];if(jump>=6){level++;jump=0;setTimeout(()=>{const win=clear('Nova fase!','Você desbloqueou a fase '+level);win.append(sceneImage(4),button('Próxima fase',run))},280)}}))}function draw(){const r=clear('Desenho que ganha vida','Desenhe seu personagem com o dedo');const canvas=node('canvas','sketch');r.append(canvas);const pal=node('div','shelf');['#ed569a','#419fe2','#e4a52e','#62b863','#9851d0','#453045'].forEach(c=>{const z=button('',()=>color=c,'color');z.style.background=c;pal.append(z)});r.append(pal,button('🧽 Limpar',()=>ctx.clearRect(0,0,canvas.width,canvas.height)),button('✨ Dar vida ao desenho',()=>{const img=canvas.toDataURL('image/png');drawingImage=img;try{localStorage.setItem('lk_pro_drawing',img)}catch(e){}showDrawn(img)}));const box=canvas.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);canvas.width=Math.max(1,box.width*dpr);canvas.height=Math.max(1,box.height*dpr);const ctx=canvas.getContext('2d');ctx.lineWidth=8*dpr;ctx.lineCap='round';ctx.lineJoin='round';let down=false;function point(ev){const t=canvas.getBoundingClientRect();return [(ev.clientX-t.left)*canvas.width/t.width,(ev.clientY-t.top)*canvas.height/t.height]}canvas.addEventListener('pointerdown',ev=>{ev.preventDefault();down=true;canvas.setPointerCapture(ev.pointerId);const [x,y]=point(ev);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+.1,y+.1);ctx.strokeStyle=color;ctx.stroke()});canvas.addEventList

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;font-family:ui-rounded,"Trebuchet MS",Arial,sans-serif;color:#5b3d6e;background:#d7f0fc}button{font:inherit;border:0;cursor:pointer;touch-action:manipulation;user-select:none}#app{position:fixed;inset:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,#a6e2fb 0%,#e0c9fd 55%,#fbdfd7 100%)}.top{height:64px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));gap:8px;z-index:2}.logo{font-size:19px;color:#a34090;font-weight:1000;text-shadow:0 2px #fff}.pill{background:#fffdfb;border:2px solid #fff;border-radius:30px;padding:9px 12px;font-weight:900;box-shadow:0 4px 0 #a97ab55c}.stage{min-height:0;flex:1;display:flex;flex-direction:column;gap:9px;padding:7px 13px 12px;align-items:center;overflow:hidden;position:relative}.banner{background:#fffdfaeF;border:3px solid #fff;border-radius:22px;padding:9px 13px;box-shadow:0 5px 0 #a987b044;text-align:center;width:min(100%,530px);flex:none;font-size:clamp(18px,4.4vw,25px);font-weight:1000}.banner small{display:block;font-size:12px;color:#9f739c;margin-top:2px}.panel{background:#fffdf8f5;border:3px solid white;border-radius:26px;box-shadow:0 7px 0 #aa83ad50;flex:1;min-height:0;max-width:580px;width:100%;padding:10px;display:flex;align-items:center;flex-direction:column;justify-content:space-around;gap:8px;overflow:hidden}.avatar{height:100%;max-height:290px;width:min(53vw,220px);flex:none}.avatarwrap{display:flex;align-items:center;justify-content:center;flex:1;min-height:80px;overflow:hidden;width:100%;position:relative}.bear{font-size:clamp(52px,10vw,80px);align-self:flex-end;margin-bottom:10px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:530px;flex:none}.tile{border:3px solid #fff;background:# {gap:4px;padding:7px}.action{min-height:37px;padding:7px 11px}.avatar{max-height:200px}.foot{height:12px}}
</style></head><body><div id="app"><div class="top"><div class="logo">🌈 Laurinha Kids</div><div class="pill" id="coins">⭐ 0</div></div><main class="stage" id="stage"></main><div class="foot">Mundo Encantado · brincar e aprender</div></div><script>
(()=>{'use strict';const root=document.getElementById('stage'),coins=document.getElementById('coins');let score=0,look='classica',dress='#f07eb2',acc='bow',drawingColor='#ee559a',round=0,stage=1,steps=0;try{score=Number(localStorage.getItem('laurinha_v2_points'))||0;look=localStorage.getItem('laurinha_v2_look')||'classica'}catch(e){}const outfits={classica:['#f07eb2','🎀','Clássica'],princesa:['#b689e2','👑','Princesa'],medica:['#f6f7ff','🩺','Médica'],aventura:['#76cfb7','🎒','Aventureira'],escola:['#eaa55f','📚','Escolinha']};function gain(n=1){score+=n;coins.textContent='⭐ '+score;try{localStorage.setItem('laurinha_v2_points',score)}catch(e){}}coins.textContent='⭐ '+score;function e(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}function b(text,fn,cls='action'){const x=e('button',cls,text);x.addEventListener('click',fn);return x}function reset(title,subtitle){root.replaceChildren();const h=e('div','banner',title);if(subtitle)h.append(e('small','',subtitle));root.append(h)}function panel(){const p=e('div','panel');root.append(p);return p}function back(){root.append(b('⌂ Voltar à vila',home,'back'))}function line(items){const x=e('div','actions');items.forEach(([label,fn,alt])=>x.append(b(label,fn,'action'+(alt?' alt':''))));return x}function picture(){const p=e('div','avatarwrap');const [c,em]=outfits[look]||outfits.classica;const a=document.createElementNS('http://www.w3.org/2000/svg','svg');a.setAttribute('viewBox','0 0 220 340');a.setAttribute('class','avatar');a.innerHTML='<ellipse cx="111" cy="330" rx="67" ry="9" fill="#d9bad5"/><path d="M52 90 Q45 7 112 8 Q178 11 171 90 L179 184 L43 184Z" fill="#593a32"/><path d="M91 162 L129 162 L130 210 L89 210Z" fill="#f4b799"/><path d="M83 184 L54 201 L40 262 Q34 283 49 287 Q61 288 66 267 L82 235Z" fill="#f5b99b"/><path d="M141 184 L166 201 L182 262 Q185 283 172 287 Q159 286 153 267 L139 235Z" fill="#f5b99b"/><path d="M89 264 L87 316 L104 321 L111 269 M128 264 L129 318 L145 320 L146 265" stroke="#f4b799" stroke-width="17" stroke-linecap="round"/><path d="M84 307 Q68 318 74 329 L108 329 L109 317Z M125 317 L126 329 L161 329 Q164 315 145 307Z" fill="#9a6ab6"/><path d="M83 186 L138 186 Q154 219 171 284 L49 284 Q70 215 83 186Z" fill="'+c+'" stroke="#fff" stroke-width="4"/><path d="M87 197 Q113 214 136 197" fill="none" stroke="#fff9" stroke-width="6"/><ellipse cx="110" cy="104" rx="62" ry="77" fill="#f6bd9b" stroke="#df9e87" stroke-width="2"/><path d="M48 87 Q46 18 102 23 Q151 15 172 70 Q153 49 130 40 Q111 79 48 87Z" fill="#593a32"/><path d="M53 86 Q46 143 51 186 L32 185 Q33 99 48 75 M170 78 Q188 117 181 185 L165 187 Q173 124 163 87" fill="#593a32"/><path d="M73 108 Q83 99 95 108 M125 107 Q139 99 149 108" fill="none" stroke="#613c39" stroke-width="4" stroke-linecap="round"/><ellipse cx="84" cy="117" rx="6" ry="9" fill="#3d3444"/><ellipse cx="136" cy="117" rx="6" ry="9" fill="#3d3444"/><circle cx="81" cy="114" r="2" fill="white"/><circle cx="133" cy="114" r="2" fill="white"/><ellipse cx="69" cy="140" rx="15" ry="7" fill="#f4979f" opacity=".6"/><ellipse cx="153" cy="140" rx="15" ry="7" fill="#f4979f" opacity=".6"/><path d="M97 150 Q111 164 125 150" stroke="#a94d6e" stroke-width="4" fill="none" stroke-linecap="round"/><text x="145" y="44" font-size="35">'+em+'</text>';p.append(a);return p}function home(){reset('Bem-vinda à Vila Encantada!','Escolha o que vamos brincar hoje');const p=picture();p.append(e('div','bear','🧸'));root.append(p);const grid=e('div','choices');[['👗','Vestir Laurinha',wardrobe],['🖍️','Meu desenho vivo',draw],['🛁','Dar banho',()=>routine('banho')],['🩺','Médico',()=>routine('medico')],['🏫','Escolinha',school],['🏃','Aventura',adventure]].forEach(([em,t,fn])=>{const z=e('button','tile');z.append(e('span','',em),document.createTextNode(t));z.addEventListener('click',fn);grid.append(z)});root.append(grid)}function wardrobe(){reset('Guarda-roupa da Laurinha','Escolha uma fantasia para brincar');const p=panel();p.append(picture());const choices=e('div','actions');Object.entries(outfits).forEach(([k,v])=>choices.append(b(v[1]+' '+v[2],()=>{look=k;try{localStorage.setItem('laurinha_v2_look',look)}catch(e){}wardrobe()},look===k?'action':'action alt')));p.append(choices,e('div','msg','A roupa escolhida aparece nos outros jogos!'));back()}const sequences={banho:[['🫧','Passe o sabonete','🧼 Esfregar'],['🚿','Enxágue com cuidado','💦 Enxaguar'],['🪥','Escove os dentinhos','🪥 Escovar'],['🧻','Seque e coloque uma roupa limpa','✨ Prontinha']],medico:[['🤒','O ursinho está indisposto. Vamos examiná-lo?','🩺 Examinar'],['🌡️','Vamos medir sua temperatura','🌡️ Medir'],['🥤','Ele precisa de água e descanso','💧 Cuidar'],['💖','Agora ele está mais confortável!','🧸 Abraçar']]};let mode='banho';function routine(which){mode=which;steps=0;next()}function next(){let arr=sequences[mode];if(steps>=arr.length){result('Missão concluída!','🎉','Você cuidou muito bem!',()=>routine(mode));return}reset(mode==='banho'?'Hora do banho':'Clínica dos Ursinhos','Missão '+(steps+1)+' de '+arr.length);const p=panel(),it=arr[steps];p.append(e('div','big',''+it[0]),e('div','counter',it[1]),line([[it[2],()=>{gain(2);steps++;next()}]]));back()}const qs=[['Qual é a letra A?',['C','A','B'],1],['Quanto é 2 + 2?',['3','4','5'],1],['Qual cor tem o sol?',['Rosa','Azul','Amarelo'],2],['O que vem depois do 5?',['6','3','2'],0],['Qual animal faz miau?',['Gato','Cachorro','Pato'],0],['Qual figura é um círculo?',['🔺','🔵','⬛'],1]];let q=0;function school(){q=0;quiz()}function quiz(){if(q===qs.length){result('Parabéns na escolinha!','🏆','Você completou todas as atividades!',school);return}let item=qs[q];reset('Escolinha da Laurinha','Atividade '+(q+1)+' de '+qs.length);const p=panel(),m=e('div','msg','Escolha uma resposta');p.append(e('div','big','📚'),e('div','counter',item[0]),line(item[1].map((v,i)=>[v,()=>{if(i===item[2]){gain(3);q++;quiz()}else m.textContent='Quase! Tente novamente. ✨'}])),m);back()}function result(t,em,desc,restart){reset(t);const p=panel();p.append(e('div','big',em),e('div','counter',desc),line([['Jogar novamente',restart]]));back()}function adventure(){reset('Corrida das Estrelas','Fase '+stage+' • toque para saltar');const p=panel(),game=e('div','game'),run=e('div','player','👧🏻'),rock=e('div','hazard','🌵'),count=e('div','counter','Saltos '+steps+'/5');game.append(run,rock);p.append(game,count,b('⬆️ PULAR!',()=>{run.style.bottom='54%';setTimeout(()=>{run.style.bottom='22%'},250);steps++;gain();rock.textContent=['🌵','🍄','🪨','🌼'][steps%4];count.textContent='Saltos '+steps+'/5';if(steps>=5){stage++;steps=0;setTimeout(()=>result('Nova fase desbloqueada!','🏅','Agora você chegou à fase '+stage,adventure),280)}}));back()}function draw(){reset('Meu Desenho Vivo','Desenhe um amiguinho e dê vida a ele');const p=panel(),area=e('div','draw'),canvas=document.createElement('canvas');area.append(canvas);p.append(area);const pal=e('div','palette');['#ee559a','#75b8f4','#fed366','#90cb83','#9976d4','#513d5b'].forEach(c=>{const z=b(' ',()=>{drawingColor=c},'dot');z.style.background=c;pal.append(z)});p.append(pal);const msg=e('div','msg','Seu desenho vai aparecer como personagem!');p.append(line([['🧽 Limpar',()=>ctx.clearRect(0,0,canvas.width,canvas.height)],['✨ Dar vida',()=>{const data=canvas.toDataURL('image/png');showDrawing(data)}]]),msg);back();const rect=area.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.max(1,rect.width*dpr);canvas.height=Math.max(1,rect.height*dpr);const ctx=canvas.getContext('2d');ctx.lineWidth=10*dpr;ctx.lineCap='round';ctx.lineJoin='round';let drawing=false;function xy(ev){const r=canvas.getBoundingClientRect();return [(ev.clientX-r.left)*canvas.width/r.width,(ev.clientY-r.top)*canvas.height/r.height]}canvas.addEventListener('pointerdown',ev=>{ev.preventDefault();drawing=true;canvas.setPointerCapture(ev.pointerId);const [x,y]=xy(ev);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+.01,y+.01);ctx.strokeStyle=drawingColor;ctx.stroke()});canvas.addEventListener('pointermove',ev=>{if(!drawing)return;ev.preventDefault();const [x,y]=xy(ev);ctx.lineTo(x,y);ctx.strokeStyle=drawingColor;ctx.stroke()});canvas.addEventListener('pointerup',()=>drawing=false);canvas.addEventListener('pointercancel',()=>drawing=false)}function showDrawing(data){reset('Seu desenho ganhou vida!','Este é seu personagem mágico');const p=panel(),image=document.createElement('img');image.src=data;image.style.cssText='width:100%;height:65%;object-fit:contain;background:#fff;border-radius:17px;animation:float 1.2s infinite alternate';p.append(image,e('div','msg','Ele está pulando de alegria!'));p.append(line([['⭐ Ganhar estrelas',()=>{gain(5);home()}],['🖍️ Desenhar outro',draw,true]]));back()}document.addEventListener('touchmove',ev=>{if(ev.cancelable)ev.preventDefault()},{passive:false});document.addEventListener('gesturestart',ev=>ev.preventDefault());home()})();
</script></body></html>

const questions=[['Quanto é 2 + 3?',['4','5','6'],1],['Qual é a letra inicial de BOLA?',['B','A','D'],0],['Qual forma é redonda?',['⬛','🔺','●'],2],['Quanto é 4 + 4?',['6','8','9'],1],['Qual animal faz miau?',['Gato','Pato','Cão'],0],['Qual é a cor do céu?',['Azul','Verde','Rosa'],0],['Quanto é 7 - 2?',['3','5','7'],1],['Qual letra vem depois de C?',['A','D','F'],1]];
function schoolDraw(){gamePanel('Escolinha da Laurinha','Desafios para aprender brincando','school');const i=quiz.i;if(won){celebrate('Diploma conquistado!');back();return}let q=questions[i%questions.length];img('school',W*.18,108,W*.64,Math.min(H*.26,210));rr(25,H*.42,W-50,65,16,'#f4d4ff','#fff',2);text(q[0],W/2,H*.42+32,Math.min(21,W*.047),'#703584');for(let n=0;n<3;n++){const y=H*.54+n*66;button(q[1][n],W*.17,y,W*.66,55,()=>{if(n===q[2]){quiz.right++;quiz.i++;addStars(2);pop(W/2,y);if(quiz.i>=questions.length){won=true;addStars(10)}}else{wrongAnswerFrames=45}},['#f7badd','#beecff','#f8d492'][n],21)}if(wrongAnswerFrames>0)text('Tente novamente!',W/2,H*.4,16,'#dc428a');back()}
function dressDraw(){gamePanel('Desfile da Laurinha','Monte um look para a passarela','dress');const bx=45,by=115,bw=W-90,bh=Math.min(H*.43,330);rr(bx,by,bw,bh,20,'#f9d5f5','#fff',3);img('dress',bx+4,by+4,bw-8,bh-8);const outfits=['Princesa','Médica','Escola','Aventura','Festa'];const color=colors[outfit];rr(W*.27,by+bh-75,W*.46,50,21,color+'be','#fff',3);text(outfits[outfit],W/2,by+bh-49,20,'#643d83');text('Escolha o figurino',W/2,by+bh+30,17,'#8e4699');for(let i=0;i<5;i++){const x=10+i*(W-20)/5,y=by+bh+47;rr(x+2,y,(W-30)/5,58,13,i===outfit?'#ffc8e6':'#fff','#fff',2);text(['👑','🩺','🎒','🧢','🎀'][i],x+(W-30)/10+2,y+23,25);buttons.push({x,y,w:(W-30)/5,h:58,action:()=>{outfit=i;save();pop(W/2,by+bh/2)}})}button('✨ DESFILAR!',W*.16,H-120,W*.68,50,()=>{won=true;addStars(5)},'#ff84c3',19);back();if(won)celebrate('Show de moda!')}
function resetPlatform(){level=Math.max(1,level);platform={x:80,y:0,vy:0,ground:0,camera:0,coins:[],hazards:[],finished:false,dead:false};for(let i=0;i<16;i++){platform.coins.push({x:270+i*123,y:185+(i%3)*-22,taken:false});if(i%3===1)platform.hazards.push({x:350+i*123,w:27})}}
function adventureDraw(dt){header('Aventura Encantada',`Fase ${level} · Colete estrelas e pule obstáculos`);let top=95,bottom=H-125,ground=bottom-50;rr(10,top,W-20,bottom-top,19,'#9fe6fc','#fff',3);g.save();g.beginPath();g.rect(15,top+5,W-30,bottom-top-10);g.clip();for(let i=0;i<8;i++){let cx=(i*190-platform.camera*.22)% (W+220);if(cx< -100)cx+=W+220;rr(cx,ground-165,82,140,31,'#f9f6ff66');}g.fillStyle='#81cc79';g.fillRect(15,ground,W-30,80);for(let i=0;i<16;i++){let x=i*90-platform.camera*.5;rr(x,ground-9,85,21,9,'#74bd56','#fff',1)}const py=ground-57-platform.y,px=platform.x-platform.camera;g.save();g.translate(px,py);if(platform.vy>0)g.rotate(-.12);img('girl',-27,-48,56,77);g.restore();for(const c of platform.coins){if(c.taken)continue;let x=c.x-platform.camera;if(x>-40&&x<W+30)text('⭐',x,ground-104+c.y-185,28)}for(let h of platform.hazards){let x=h.x-platform.camera;if(x>-40&&x<W+30)text('🌵',x,ground-30,40)}g.restore();rr(20,top+14,114,34,18,'#fff8','#fff',2);text('⭐ '+adventureCoins,W*.2,top+31,17,'#924e9a');button('⬆ PULAR',W*.55,H-109,W*.4,53,()=>jump(),'#f6a4d8',18);back();if(platform.dead){rr(42,H*.35,W-84,120,20,'#fff','#fff',3);text('Tente novamente!',W/2,H*.39,22,'#b63b9c');button('↻ Reiniciar',W*.24,H*.43,W*.52,48,()=>resetPlatform(),'#b7eaff');return}if(platform.finished){celebrate('Fase completa!');button('Próxima fase',W*.18,H*.57,W*.64,50,()=>{level++;resetPlatform()},'#ffe278')}
if(!platform.finished&&!platform.dead){platform.vy-=1250*dt;platform.y=Math.max(0,platform.y+platform.vy*dt);if(platform.y===0)platform.vy=Math.max(0,platform.vy);platform.x+=Math.min(185+level*15,275)*dt;platform.camera=Math.max(0,platform.x-W*.27);for(let c of platform.coins){if(!c.taken&&Math.abs(c.x-platform.x)<32&&platform.y>15){c.taken=true;adventureCoins++;addStars(1);pop(px,py)}}for(let h of platform.hazards){if(Math.abs(h.x-platform.x)<22&&platform.y<28)platform.dead=true}if(platform.x>2250){platform.finished=true;addStars(10)}}}
function jump(){if(scene==='adventure'&&platform.y<=1&&!platform.dead&&!platform.finished)platform.vy=485}
function drawMode(){gamePanel('Desenho que ganha vida','Desenhe seu personagem e veja-o correr','draw');const bx=25,by=111,bw=W-50,bh=Math.min(H*.5,415);rr(bx,by,bw,bh,19,'#ffffff','#ef95d4',4);g.save();g.beginPath();g.rect(bx,by,bw,bh);g.clip();for(let path of paint.paths){g.strokeStyle=path.color;g.lineWidth=path.width;g.lineCap='round';g.lineJoin='round';g.beginPath();path.points.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke()}g.restore();let pal=['#ee54a5','#4bb3f1','#ffb522','#74ca70','#9566e9','#403c4f'];pal.forEach((c,i)=>{let x=17+i*(W-34)/6,y=by+bh+20;rr(x+3,y,(W-54)/6,39,16,c,'#fff',3);buttons.push({x,y,w:(W-34)/6,h:46,action:()=>paint.color=c})});button('🧽 Apagar',W*.07,H-119,W*.39,48,()=>paint.paths=[],'#bbebff');button('✨ Dar vida',W*.54,H-119,W*.39,48,()=>{if(!paint.paths.length)return;customSprite=paint.paths.map(p=>({color:p.color,width:p.width,points:p.points.map(([x,y])=>[(x-bx)/bw,(y-by)/bh])}));scene='alive';addStars(5)},'#ffb8e1');back()}
function drawPointer(x,y,phase){const bx=25,by=111,bw=W-50,bh=Math.min(H*.5,415);if(x<bx||x>bx+bw||y<by||y>by+bh)return;if(phase==='down'){paint.current={color:paint.color,width:paint.size,points:[[x,y]]};paint.paths.push(paint.current)}else if(phase==='move'&&paint.current)paint.current.points.push([x,y]);else if(phase==='up')paint.current=null}
function aliveDraw(){gamePanel('Seu desenho ganhou vida!','Ele pode dançar, pular e brincar','draw');let t=gameTime, bx=30,by=H*.23,bw=W-60,bh=H*.39;rr(bx,by,bw,bh,18,'#e3f7ff','#fff',3);if(customSprite){g.save();let cy=by+bh*.54+Math.sin(t*4)*16;g.translate(bx+bw*.28,cy);g.rotate(Math.sin(t*3)*.1);g.scale(.62,.62);for(let p of customSprite){g.strokeStyle=p.color;g.lineWidth=p.width*1.3;g.lineCap='round';g.lineJoin='round';g.beginPath();p.points.forEach((q,i)=>{let x=(q[0]-.5)*bw,y=(q[1]-.5)*bh;if(!i)g.moveTo(x,y);else g.lineTo(x,y)});g.stroke()}g.restore()}text('Seu personagem está dançando!',W/2,H*.72,18,'#88428e');button('🎨 Outro desenho',W*.16,H-122,W*.68,52,()=>enter('draw'),'#fcb5da');back()}
function rewardsDraw(){gamePanel('Meu álbum de estrelas','Cada conquista é uma nova aventura');img('menu',30,122,W-60,H*.30);text('⭐ '+stars+' estrelas conquistadas',W/2,H*.57,22,'#a948a0');text('Fase atual: '+level,W/2,H*.63,17,'#805f9d');button('Voltar a jogar',W*.19,H-123,W*.62,50,home,'#ffc3e4');back()}
function celebrate(t){rr(W*.08,H*.27,W*.84,125,25,'#fff9','#fff',4);text('🏆 '+t,W/2,H*.31,20,'#ad459d');text('Você conseguiu!',W/2,H*.38,17,'#9254a0')}
function updateParticles(dt){for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=170*dt;p.life-=dt*1.2;if(p.life<=0){particles.splice(i,1);continue}g.globalAlpha=p.life;g.fillStyle=p.color;g.beginPath();g.arc(p.x,p.y,4+p.life*3,0,Math.PI*2);g.fill();g.globalAlpha=1}}
let last=0;function frame(now){try{const dt=Math.min((now-last)/1000||.016,.035);last=now;gameTime+=dt;buttons=[];if(scene==='home')homeDraw();else if(scene==='bath')bathDraw();else if(scene==='doctor')doctorDraw();else if(scene==='school')schoolDraw();else if(scene==='dress')dressDraw();else if(scene==='adventure')adventureDraw(dt);else if(scene==='draw')drawMode();else if(scene==='alive')aliveDraw();else rewardsDraw();updateParticles(dt);wrongAnswerFrames=Math.max(0,wrongAnswerFrames-1);requestAnimationFrame(frame)}catch(ex){loading.classList.remove('hide');loading.textContent='Erro ao iniciar jogo: '+String(ex.message||ex);loading.style.padding='24px';loading.style.textAlign='center';console.error(ex)}}
function handle(ev,phase){ev.preventDefault();const x=ev.clientX,y=ev.clientY;if(phase==='down'){pointer={x,y,down:true};if(scene==='draw'&&y<Math.min(H*.5,415)+111&&y>111){drawPointer(x,y,'down');gesture='draw';return}if(scene==='bath'&&y<Math.min(H*.44,390)+115&&y>115){gesture='bath';bathPointer(x,y);return}if(scene==='doctor'&&y>115&&y<Math.min(H*.42,330)+115){gesture='doctor';return}gesture=null}else if(phase==='move'){if(gesture==='draw')drawPointer(x,y,'move');else if(gesture==='bath')bathPointer(x,y);return}else if(phase==='up'){if(gesture==='draw'){drawPointer(x,y,'up');gesture=null;return}if(gesture==='bath'){gesture=null;return}if(gesture==='doctor'){doctorPointer(x,y,'up');gesture=null;return}const hits=buttons.filter(b=>x>=b.x&&y>=b.y&&x<=b.x+b.w&&y<=b.y+b.h);const b=hits[hits.length-1];if(b)b.action();pointer=null}}
cn.addEventListener('pointerdown',e=>{cn.setPointerCapture(e.pointerId);handle(e,'down')});cn.addEventListener('pointermove',e=>{if(pointer?.down)handle(e,'move')});cn.addEventListener('pointerup',e=>handle(e,'up'));cn.addEventListener('pointercancel',()=>{pointer=null;gesture=null});document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturestart',e=>e.preventDefault());document.addEventListener('keydown',e=>{if((e.key===' '||e.key==='ArrowUp')&&scene==='adventure'){e.preventDefault();jump()}if(e.key==='Escape')home()});loading.classList.add('hide');for(let [k,src] of Object.entries(sources)){let pic=new Image();images[k]=pic;pic.src=src}requestAnimationFrame(frame)})();
</script></body></html>

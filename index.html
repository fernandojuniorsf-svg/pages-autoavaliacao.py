<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f9cfef"><meta name="apple-mobile-web-app-capable" content="yes"><title>Laurinha Kids · Vila Encantada</title><style>
:root{--pink:#ef6aad;--ink:#653c70;--cream:#fffaf0}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;font-family:ui-rounded,"Trebuchet MS",Arial,sans-serif;color:var(--ink)}button{font:inherit;cursor:pointer;border:0;touch-action:manipulation}#app{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#a5dfff 0 58%,#b7e9a1 58%);display:flex;flex-direction:column}.decor{position:absolute;inset:0;pointer-events:none;overflow:hidden}.sun{position:absolute;right:10%;top:10%;width:76px;height:76px;border-radius:50%;background:#ffe783;box-shadow:0 0 0 15px #fff0ad80}.cloud{position:absolute;width:115px;height:46px;border-radius:50px;background:#fff9;left:-20px;top:19%;box-shadow:28px -21px 0 0 #fff9,67px -7px 0 0 #fff9}.cloud.two{left:auto;right:5%;top:31%;transform:scale(.7)}.hill{position:absolute;bottom:-14%;width:110%;height:46%;background:#96d48a;border-radius:50% 50% 0 0;left:-20%}.hill.two{left:32%;background:#b7e9a1;bottom:-19%}.top{z-index:3;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 12px) 16px 9px;gap:9px}.brand{background:#fffdf8ec;border:3px solid white;border-radius:23px;box-shadow:0 6px 0 #bd88b044;padding:8px 14px;font-size:16px;font-weight:1000;color:#dc548d}.stars{background:#fffdf8f0;border:3px solid white;border-radius:25px;padding:9px 14px;box-shadow:0 6px 0 #bd88b044;font-weight:1000}.screen{z-index:2;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:2px 14px 15px;gap:8px}.heading{text-align:center;background:#fffdf9eb;border:3px solid #fff;padding:10px 16px;border-radius:27px;box-shadow:0 6px 0 #bb86a055;max-width:100%;font-weight:1000;font-size:clamp(19px,5.7vw,29px)}.sub{display:block;font-size:12px;font-weight:800;margin-top:4px;color:#8b688c}.hero{display:flex;justify-content:center;align-items:end;gap:20px;width:100%;min-height:130px;flex:1;max-height:280px}.person{position:relative;width:132px;height:220px;max-height:100%;filter:drop-shadow(0 9px 3px #648d6e55);flex:none}.hair{position:absolute;width:108px;height:111px;left:12px;top:15px;background:#6d3d34;border-radius:52% 52% 42% 42%;box-shadow:inset -11px 0 #512d2b}.face{position:absolute;top:27px;left:24px;width:86px;height:94px;background:#f6bb95;border-radius:47% 47% 48% 48%;border:3px solid #d9927d}.bang{position:absolute;left:19px;top:16px;width:95px;height:49px;background:#6d3d34;border-radius:70% 35% 65% 16%;transform:rotate(-5deg)}.eye{position:absolute;top:48px;width:10px;height:14px;border-radius:50%;background:#382e3e}.eye.a{left:20px}.eye.b{right:20px}.cheek{position:absolute;top:66px;width:17px;height:9px;border-radius:50%;background:#f49395aa}.cheek.a{left:9px}.cheek.b{right:9px}.smile{position:absolute;top:68px;left:35px;border-bottom:3px solid #a34d60;width:18px;height:12px;border-radius:0 0 50% 50%}.bow{position:absolute;top:2px;left:69px;font-size:33px;z-index:3}.neck{position:absolute;top:113px;left:58px;width:18px;height:20px;background:#efb293}.dress{position:absolute;top:129px;left:17px;width:100px;height:62px;background:var(--dress,#f06daa);clip-path:polygon(27% 0,73% 0,100% 100%,0 100%);border-radius:20px 20px 9px 9px}.arm{position:absolute;top:138px;width:19px;height:54px;background:#f6bb95;border-radius:20px}.arm.a{left:8px;transform:rotate(16deg)}.arm.b{right:8px;transform:rotate(-16deg)}.leg{position:absolute;top:184px;width:20px;height:33px;background:#f6bb95;border-radius:0 0 12px 12px}.leg.a{left:38px}.leg.b{right:38px}.shoe{position:absolute;bottom:1px;width:31px;height:12px;background:#714d9b;border-radius:15px}.shoe.a{left:30px}.shoe.b{right:30px}.bear{font-size:72px;filter:drop-shadow(0 7px 1px #638b6555);align-self:center}.tiles{width:100%;max-width:570px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.tile{border:3px solid #fff;border-radius:22px;box-shadow:0 6px 0 #ae7f9e55;background:#fff2fcf2;min-height:85px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#75496f;font-weight:1000;font-size:13px}.tile span{font-size:32px;margin-bottom:3px}.tile:nth-child(2n){background:#eaffffed}.tile:nth-child(3n){background:#fff5d9ed}.footer{z-index:3;text-align:center;font-size:11px;font-weight:800;padding:3px 0 calc(env(safe-area-inset-bottom) + 8px);color:#557850}.scene{background:#fffcf5f1;border:4px solid white;border-radius:28px;padding:15px;width:100%;max-width:560px;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-around;box-shadow:0 8px 0 #98818a44;gap:8px}.scene .big{font-size:clamp(70px,20vh,128px);line-height:1;text-align:center}.prompt{font-size:17px;font-weight:1000;text-align:center}.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;width:100%}.choice{min-width:75px;min-height:54px;padding:10px;border-radius:17px;background:#ffc8e6;color:#633a6a;border:3px solid white;box-shadow:0 4px 0 #c17ba7;font-weight:1000}.choice:nth-child(2n){background:#caf0ff}.nav{display:flex;gap:10px;justify-content:center}.nav button{background:#8356a8;color:white;border:3px solid white;padding:12px 24px;border-radius:22px;font-weight:1000;box-shadow:0 5px 0 #55376c}.message{font-size:15px;min-height:25px;text-align:center;font-weight:900;color:#d2548d}.palette{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.swatch{width:43px;height:43px;border-radius:50%;border:4px solid white;box-shadow:0 3px 0 #876578}.canvasbox{width:100%;flex:1;min-height:130px;border-radius:20px;border:4px dashed #edadd0;overflow:hidden;background:white;touch-action:none;position:relative}.canvasbox canvas{display:block;width:100%;height:100%;touch-action:none}.platform{position:relative;width:100%;height:42%;min-height:150px;background:linear-gradient(#9bd7ff 0 76%,#9bd484 76%);border-radius:22px;overflow:hidden;border:3px solid #fff}.runner{position:absolute;bottom:25%;left:17%;font-size:48px;transition:bottom .22s}.obstacle{position:absolute;bottom:23%;right:14%;font-size:38px}.score{font-size:17px;font-weight:1000}.pulse{animation:pulse .3s ease}@keyframes pulse{50%{transform:translateY(-8px)}}@media(max-height:690px){.hero{max-height:180px;min-height:120px}.person{transform:scale(.8);transform-origin:bottom}.tile{min-height:64px}.tile span{font-size:26px}.heading{padding:6px 14px}.scene{padding:9px}}@media(min-width:700px){.tiles{gap:16px}.tile{min-height:105px}.hero{max-height:330px}}
</style></head><body><div id="app"><div class="decor"><div class="sun"></div><div class="cloud"></div><div class="cloud two"></div><div class="hill"></div><div class="hill two"></div></div><div class="top"><div class="brand">🌈 Laurinha Kids</div><div class="stars" id="stars">⭐ 0</div></div><main class="screen" id="screen"><div class="heading">Vila Encantada<span class="sub">Escolha uma aventura!</span></div></main><div class="footer">Aprender • Brincar • Imaginar</div></div><script>
(function(){'use strict';const screen=document.getElementById('screen'),stars=document.getElementById('stars');let pts=0,step=0,mode='',dress='#f06daa',color='#ee5c9f',drawing=false,paintCtx=null,level=1,jumps=0;try{pts=Number(localStorage.getItem('lk_stars')||0)}catch(e){}function update(){stars.textContent='⭐ '+pts}function earn(n=1){pts+=n;try{localStorage.setItem('lk_stars',pts)}catch(e){}update()}function btn(t,fn,cls='choice'){const b=document.createElement('button');b.className=cls;b.textContent=t;b.addEventListener('click',fn);return b}function el(tag,cls,txt){let e=document.createElement(tag);if(cls)e.className=cls;if(txt)e.textContent=txt;return e}function clear(){screen.replaceChildren()}function person(){const p=el('div','person');p.style.setProperty('--dress',dress);p.innerHTML='<div class="hair"></div><div class="neck"></div><div class="arm a"></div><div class="arm b"></div><div class="leg a"></div><div class="leg b"></div><div class="dress"></div><div class="face"><div class="eye a"></div><div class="eye b"></div><div class="cheek a"></div><div class="cheek b"></div><div class="smile"></div></div><div class="bang"></div><div class="bow">🎀</div><div class="shoe a"></div><div class="shoe b"></div>';return p}function header(t,sub){let h=el('div','heading',t);if(sub)h.append(el('span','sub',sub));screen.append(h)}function actions(items){const a=el('div','choices');items.forEach(([t,f])=>a.append(btn(t,f)));return a}function nav(){const n=el('div','nav');n.append(btn('⌂ Vila Encantada',home));screen.append(n)}function board(title,emoji,question,options){clear();header(title);const s=el('div','scene');const big=el('div','big',emoji),q=el('div','prompt',question),msg=el('div','message');s.append(big,q,actions(options.map(([t,ans])=>[t,()=>{msg.textContent=typeof ans==='function'?ans():ans;big.classList.add('pulse');setTimeout(()=>big.classList.remove('pulse'),300)}])),msg);screen.append(s);nav();return {big,q,msg,s}}function home(){mode='';clear();header('Vila Encantada','Brinque com a Laurinha e o ursinho!');const h=el('div','hero');h.append(person(),el('div','bear','🧸'));screen.append(h);const t=el('div','tiles');[['🛁','Banho',()=>activity('bath')],['🩺','Médico',()=>activity('doctor')],['🏫','Escola',school],['👗','Moda',fashion],['🏃','Aventura',adventure],['🎨','Desenhar',drawingGame]].forEach(([ic,name,fn])=>{const b=el('button','tile');b.append(el('span','',ic),document.createTextNode(name));b.addEventListener('click',fn);t.append(b)});screen.append(t)}const bath=[['🫧','Passe o sabonete','🧼 Sabonete'],['🚿','Enxágue com água','💧 Água'],['🪥','Escove os dentinhos','🪥 Escovar'],['✨','Seque com a toalha','🧻 Toalha']];const doctor=[['🤒','O ursinho não está bem','🩺 Examinar'],['🌡️','Vamos medir a temperatura','🌡️ Termômetro'],['🧸','Ele precisa descansar','🛏️ Descansar'],['💖','Muito bem! O ursinho está melhor','💗 Cuidar']];function activity(m){mode=m;step=0;advance()}function advance(){const arr=mode==='bath'?bath:doctor;if(step>=arr.length){board(mode==='bath'?'Banho completo!':'Ursinho cuidado!','🎉','Você conseguiu!',[['⭐ Ganhar estrela',()=>{earn(3);home();return 'Parabéns!'}]]);return}const [emoji,q,action]=arr[step];board(mode==='bath'?'Hora do banho':'Clínica dos Ursinhos',emoji,q,[[action,()=>{earn(1);step++;advance();return 'Muito bem!'}]])}const quiz=[['Qual é a letra A?',['A','B','D'],0],['Quanto é 2 + 1?',['2','3','4'],1],['Qual é a cor do sol?',['Amarelo','Verde','Roxo'],0],['Qual número vem depois do 4?',['7','5','3'],1],['Qual animal faz miau?',['Cão','Gato','Pato'],1],['Qual forma é redonda?',['🔺','🔵','⬛'],1],['Quanto é 1 + 1?',['2','3','5'],0],['Qual letra começa a palavra Bola?',['F','B','L'],1]];let qi=0;function school(){mode='school';qi=0;question()}function question(){if(qi>=quiz.length){board('Aula concluída!','🏆','Você é uma estrela na escola!',[['Voltar à vila',home]]);return}const [q,opts,correct]=quiz[qi];board('Escolinha • '+(qi+1)+'/'+quiz.length,'📚',q,opts.map((o,i)=>[o,()=>{if(i===correct){earn(2);qi++;question();return 'Muito bem!'}return 'Tente outra vez!'}]))}function fashion(){mode='fashion';clear();header('Desfile da Laurinha','Escolha a roupa e entre na passarela!');const s=el('div','scene');const h=el('div','hero');h.append(person());s.append(h,el('div','prompt','Escolha a cor do vestido'));const c=el('div','palette');[['Rosa','#f06daa'],['Azul','#65bbe8'],['Lilás','#ab80d7'],['Amarelo','#f2c94c'],['Verde','#78bd79']].forEach(([n,v])=>{const b=el('button','swatch');b.style.background=v;b.setAttribute('aria-label',n);b.addEventListener('click',()=>{dress=v;fashion()});c.append(b)});s.append(c,btn('✨ Começar desfile',()=>{earn(3);board('Desfile mágico!','👑✨','Você brilhou na passarela!',[['Trocar roupa',fashion],['Voltar',home]])}));screen.append(s);nav()}function adventure(){mode='adventure';clear();header('Aventura nas Nuvens','Pule e conquiste as estrelas!');const s=el('div','scene'),arena=el('div','platform');const r=el('div','runner','👧🏻'),obs=el('div','obstacle','🌵');arena.append(r,obs);s.append(arena,el('div','score','Fase '+level+' • Saltos '+jumps+'/5'));s.append(btn('⬆️ PULAR!',()=>{r.style.bottom='58%';earn(1);jumps++;setTimeout(()=>r.style.bottom='25%',250);obs.textContent=['🌵','🪨','🍄','🌼'][jumps%4];if(jumps>=5){level++;jumps=0;setTimeout(()=>board('Fase concluída!','🏅','Você desbloqueou a fase '+level+'!',[['Próxima fase',adventure],['Voltar',home]]),340)}else s.querySelector('.score').textContent='Fase '+level+' • Saltos '+jumps+'/5'}));screen.append(s);nav()}function drawingGame(){mode='draw';clear();header('Ateliê Mágico','Desenhe com seu dedo!');const s=el('div','scene');let wrap=el('div','canvasbox'),canvas=document.createElement('canvas');wrap.append(canvas);s.append(wrap);const colors=el('div','palette');['#ee5c9f','#60c8ef','#ffb439','#8dcf71','#9b79db','#3e3548'].forEach(c=>{const b=el('button','swatch');b.style.background=c;b.addEventListener('click',()=>color=c);colors.append(b)});s.append(colors,btn('🧽 Limpar desenho',()=>{paintCtx.clearRect(0,0,canvas.width,canvas.height)}));screen.append(s);nav();const rect=wrap.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.max(1,rect.width*dpr);canvas.height=Math.max(1,rect.height*dpr);paintCtx=canvas.getContext('2d');paintCtx.lineCap='round';paintCtx.lineJoin='round';paintCtx.lineWidth=9*dpr;function pos(e){const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height]}canvas.addEventListener('pointerdown',e=>{e.preventDefault();drawing=true;canvas.setPointerCapture(e.pointerId);const [x,y]=pos(e);paintCtx.beginPath();paintCtx.moveTo(x,y);paintCtx.lineTo(x+.1,y+.1);paintCtx.strokeStyle=color;paintCtx.stroke()});canvas.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const [x,y]=pos(e);paintCtx.lineTo(x,y);paintCtx.strokeStyle=color;paintCtx.stroke()});const stop=()=>{drawing=false};canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop)}document.addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault()},{passive:false});update();home()})();
</script></body></html>

<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>Laurinha Kids · Hospital do Ursinho</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#2c1651;touch-action:none}#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}#hint{position:fixed;bottom:max(8px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font:600 10px system-ui;color:#ffffff90;pointer-events:none;white-space:nowrap}#error{display:none;position:fixed;inset:20%;background:white;color:#632c75;padding:25px;font:16px sans-serif;border-radius:20px}</style></head><body><canvas id="game" aria-label="Jogo interativo Hospital do Ursinho"></canvas><div id="hint">Arraste os objetos com seu dedo • Jogo criado para Laurinha Kids</div><div id="error"></div><script>
(()=>{'use strict';const C=document.querySelector('#game'),ctx=C.getContext('2d');if(!ctx){document.querySelector('#error').style.display='block';return}const W=900,H=1600;let scale=1,ox=0,oy=0,down=null,drag=null,level=0,stars=0,confetti=[],t=0,last=0,done=false,hover=false,sfx=true;try{stars=Number(localStorage.getItem('laurinha_hospital_stars'))||0}catch{};
const tasks=[{name:'Escutar o coração',sub:'Leve o estetoscópio até o peito do ursinho',tool:'scope',target:[555,807],tip:'Ouça o coração bater!'},{name:'Medir a temperatura',sub:'Arraste o termômetro até a testa',tool:'thermo',target:[552,612],tip:'Temperatura normal! Muito bem!'},{name:'Cuidar do machucado',sub:'Arraste o curativo até o braço',tool:'band',target:[667,825],tip:'O ursinho está se sentindo melhor!'},{name:'Dar água ao ursinho',sub:'Leve o copinho até a boca',tool:'water',target:[554,745],tip:'Água e descanso fazem bem!'},{name:'Dar carinho',sub:'Arraste o coração para abraçar',tool:'heart',target:[546,791],tip:'O ursinho está feliz e recuperado!'}];
const tools=[{id:'scope',x:125,y:1270},{id:'thermo',x:292,y:1270},{id:'band',x:459,y:1270},{id:'water',x:625,y:1270},{id:'heart',x:790,y:1270}];
function resize(){const d=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;C.width=w*d;C.height=h*d;C.style.width=w+'px';C.style.height=h+'px';scale=Math.min(w/W,h/H);ox=(w-W*scale)/2;oy=(h-H*scale)/2;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function rr(x,y,w,h,r,fill,stroke,lw=1){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke()}}
function ell(x,y,rx,ry,c){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()}
function line(points,c,width=6){ctx.strokeStyle=c;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke()}
function text(s,x,y,size=32,color='#603072',align='center',weight=900){ctx.font=weight+' '+size+'px "Trebuchet MS",Arial,sans-serif';ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillStyle=color;ctx.fillText(s,x,y)}
function grad(x,y,w,h,a,b){let g=ctx.createLinearGradient(x,y,x,y+h);g.addColorStop(0,a);g.addColorStop(1,b);return g}
function star(x,y,r=20,c='#ffcf35'){ctx.save();ctx.translate(x,y);ctx.beginPath();for(let i=0;i<10;i++){let q=-Math.PI/2+i*Math.PI/5,rad=i%2?r*.48:r;ctx.lineTo(Math.cos(q)*rad,Math.sin(q)*rad)}ctx.closePath();ctx.fillStyle=c;ctx.fill();ctx.strokeStyle='#fff8d4';ctx.lineWidth=3;ctx.stroke();ctx.restore()}
function hairGirl(x,y,z=1){ctx.save();ctx.translate(x,y);ctx.scale(z,z);ell(0,0,82,105,'#61352d');ell(0,12,68,84,'#f5b58f');ell(-72,49,27,65,'#64382f');ell(72,49,25,63,'#64382f');ell(-32,21,8,12,'#3a2830');ell(32,21,8,12,'#3a2830');ell(-35,17,3,3,'white');ell(28,17,3,3,'white');ell(-52,46,17,9,'#ed8e9c99');ell(52,46,17,9,'#ed8e9c99');ctx.beginPath();ctx.arc(0,44,18,.1,Math.PI-.1);ctx.strokeStyle='#a94a64';ctx.lineWidth=5;ctx.stroke();ctx.beginPath();ctx.moveTo(-73,-31);ctx.quadraticCurveTo(-73,-115,12,-95);ctx.quadraticCurveTo(74,-108,74,-29);ctx.quadraticCurveTo(21,-63,-6,-61);ctx.quadraticCurveTo(-32,-35,-73,-31);ctx.fillStyle='#663a2e';ctx.fill();text('✿',56,-83,34,'#fc80ae');ctx.restore()}
function girl(){ctx.save();ctx.translate(181,729+Math.sin(t*2)*4);ctx.save();ctx.rotate(-.04);ell(0,215,100,17,'#8a6da658');ell(-33,169,19,88,'#f3b18b');ell(39,169,19,88,'#f3b18b');ell(-40,246,42,18,'#a05cc7');ell(45,246,42,18,'#a05cc7');rr(-82,44,160,165,35,'#f8f7ff','#e3d1f8',5);rr(-8,45,22,160,4,'#ed83b2');ell(-91,110,25,85,'#f4bb96');ell(93,115,25,83,'#f4bb96');line([[-120,158],[-122,113],[-100,83]],'#f9fbff',32);line([[121,160],[119,111],[96,84]],'#f9fbff',32);hairGirl(0,-52,1);ctx.restore();ctx.restore()}
function bear(){let bob=Math.sin(t*2.3)*3;ctx.save();ctx.translate(551,742+bob);ell(0,260,164,20,'#745a8b36');ell(-123,-101,64,65,'#a96834');ell(123,-101,64,65,'#a96834');ell(-121,-101,39,43,'#e8b582');ell(123,-101,39,43,'#e8b582');ell(-111,157,61,86,'#ad703d');ell(113,157,61,86,'#ad703d');ell(0,96,158,173,'#c38b54');ell(0,124,101,121,'#eacba1');ell(-114,215,61,40,'#9e6136');ell(108,215,61,40,'#9e6136');ell(0,-67,142,147,'#bd824d');ell(-53,-89,13,17,'#29252b');ell(53,-89,13,17,'#29252b');ell(-60,-93,4,5,'white');ell(47,-93,4,5,'white');ell(0,-5,73,49,'#ecd2ad');ell(0,-32,20,13,'#604033');ctx.beginPath();ctx.arc(-12,-3,15,0,Math.PI);ctx.arc(12,-3,15,0,Math.PI);ctx.strokeStyle='#654235';ctx.lineWidth=5;ctx.stroke();ell(-94,-23,18,9,'#e59c9e88');ell(92,-23,18,9,'#e59c9e88');rr(-45,-215,90,33,7,'#fffaf5','#e8dfe1',2);rr(-9,-239,18,75,3,'#fffaf5','#e8dfe1',2);if(level>=3)rr(95,90,75,28,7,'#ffe5be','#fff',4);ctx.restore()}
function toolIcon(id,x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);if(id==='scope'){ctx.strokeStyle='#76649b';ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(-28,-40);ctx.lineTo(-28,8);ctx.bezierCurveTo(-30,65,33,67,34,0);ctx.lineTo(34,-20);ctx.stroke();ell(34,-30,15,15,'#ec8cb8');ell(-28,-43,11,11,'#594a7d')}else if(id==='thermo'){ctx.rotate(.6);rr(-14,-62,28,116,14,'#f9edf8','#a777a0',5);rr(-5,-37,10,61,5,'#f16d9b');ell(0,44,17,17,'#f16d9b')}else if(id==='band'){ctx.rotate(-.45);rr(-53,-23,106,47,15,'#ffd6a2','#daab84',4);rr(-21,-22,42,43,8,'#f8ecce');for(let k=0;k<3;k++){ell(-37,(-12+k*12),3,3,'#c99172');ell(37,(-12+k*12),3,3,'#c99172')}}else if(id==='water'){rr(-42,-42,84,88,13,'#b7e9ff','#fff',6);rr(-33,0,66,37,8,'#65c9f2');line([[39,-25],[57,-19],[56,18],[40,20]],'#e8faff',9)}else if(id==='heart'){ctx.fillStyle='#f66ca9';ctx.beginPath();ctx.moveTo(0,52);ctx.bezierCurveTo(-88,-1,-54,-60,0,-28);ctx.bezierCurveTo(54,-60,88,-1,0,52);ctx.fill();star(24,-6,11,'#fff4aa')}ctx.restore()}
function background(){let g=grad(0,0,W,H,'#91dcfb','#f4c9ed');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<17;i++)ell((i*173)%900,(i*307)%1500,2+Math.sin(i)*2,4,'#ffffff78');rr(0,130,900,1050,0,'#ffe4ee');for(let x=0;x<900;x+=90){ctx.fillStyle=x%180?'#ffd6e8':'#ffecf4';ctx.fillRect(x,130,90,1050)}rr(25,220,850,855,44,'#e6bcf7','#fff',14);rr(45,242,810,804,34,grad(0,242,0,804,'#c2eafc','#f7e7ff'));rr(594,304,218,250,21,'#faf5ff','#d8a5ed',10);rr(617,326,174,198,12,'#9bdcf3');line([[704,328],[704,524]],'#fff',9);line([[619,426],[790,426]],'#fff',9);star(698,379,30);rr(60,1034,780,126,30,'#f7fcff','#ddaddb',8);rr(0,1150,900,450,0,'#eec6a3');for(let i=0;i<10;i++)line([[0,1170+i*52],[900,1170+i*52]],'#e8b79366',2);rr(25,1050,850,28,14,'#fff');rr(30,1090,840,26,13,'#cfa5c7');}
function hud(){rr(36,35,828,132,43,grad(0,35,0,132,'#ffffff','#f9e2ff'),'#fff',9);text('HOSPITAL DO URSINHO',450,81,45,'#ab3f92');text('LAURINHA KIDS • CUIDAR E APRENDER',450,127,23,'#8a67a4');rr(38,186,824,95,30,'#fff9ffef','#fff',6);text(done?'URSINHO RECUPERADO!':tasks[level].name,450,221,34,'#8648ae');text(done?'Você cuidou dele com muito carinho!':tasks[level].sub,450,256,21,'#af6d9e');rr(35,292,165,61,25,'#f9dbf4','#fff',5);star(72,322,20);text(''+stars,124,323,29,'#8c4997');rr(705,292,155,61,25,'#e1ceff','#fff',5);text((done?5:level+1)+'/5',785,323,31,'#8151a5');}
function inventory(){rr(16,1178,868,257,36,'#fff9ffed','#fff',9);text(done?'Parabéns! Você concluiu o atendimento':'ESCOLHA E ARRASTE O INSTRUMENTO',450,1214,25,'#874a97');tools.forEach((q,i)=>{const active=tasks[level]?.tool===q.id&&!done;rr(q.x-72,1235,144,153,26,active?'#ffe2f2':'#f1e6fc',active?'#f077b8':'#fff',active?8:4);toolIcon(q.id,q.x,q.y,active?0.89:0.69);if(active){star(q.x+49,1250,13);text('PEGUE',q.x,1363,19,'#b54596')}});rr(45,1460,810,88,35,done?'#b5eecb':'#9c68d8','#fff',6);text(done?'JOGAR DE NOVO':'VOLTAR AO INÍCIO / RECOMEÇAR',450,1505,30,'white');}
function effect(){if(drag){toolIcon(drag.id,drag.x,drag.y,1.1);ell(drag.x,drag.y+72,45,6,'#8a5caa44')}confetti=confetti.filter(p=>p.life>0);for(const p of confetti){p.y+=p.v;p.life-=.016;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,9,14)}}
function draw(ts){t=ts/1000;ctx.setTransform(C.width/innerWidth,0,0,C.height/innerHeight,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);ctx.translate(ox,oy);ctx.scale(scale,scale);background();hud();girl();bear();if(!done){const trg=tasks[level].target;ctx.globalAlpha=.5+.3*Math.sin(t*4);ctx.strokeStyle='#fd75b2';ctx.lineWidth=7;ctx.beginPath();ctx.arc(trg[0],trg[1],52,0,7);ctx.stroke();ctx.globalAlpha=1}inventory();effect();requestAnimationFrame(draw)}requestAnimationFrame(draw);
function position(ev){let r=C.getBoundingClientRect();return {x:(ev.clientX-r.left-ox)/scale,y:(ev.clientY-r.top-oy)/scale}}
C.addEventListener('pointerdown',ev=>{ev.preventDefault();const p=position(ev);down=p;C.setPointerCapture(ev.pointerId);if(p.y>1444&&p.y<1570){done=false;level=0;drag=null;return}if(done)return;const q=tools.find(q=>Math.abs(p.x-q.x)<75&&Math.abs(p.y-q.y)<97);if(q&&q.id===tasks[level].tool){drag={id:q.id,x:p.x,y:p.y};hover=true}});
C.addEventListener('pointermove',ev=>{if(!drag)return;ev.preventDefault();const p=position(ev);drag.x=p.x;drag.y=p.y});
C.addEventListener('pointerup',ev=>{if(!drag)return;ev.preventDefault();let p=position(ev),trg=tasks[level].target;if(Math.hypot(p.x-trg[0],p.y-trg[1])<175){level++;stars+=3;try{localStorage.setItem('laurinha_hospital_stars',stars)}catch{}for(let i=0;i<40;i++)confetti.push({x:trg[0]+(Math.random()-.5)*260,y:trg[1]+(Math.random()-.5)*140,v:2+Math.random()*7,life:1.2,c:['#fc64a5','#ffcf4e','#79d8ff','#a987ee'][i%4]});if(level>=tasks.length){done=true;level=4}}drag=null});C.addEventListener('pointercancel',()=>drag=null);document.addEventListener('gesturestart',ev=>ev.preventDefault());window.addEventListener('error',ev=>{document.querySelector('#error').style.display='block';document.querySelector('#error').textContent='Erro no jogo: '+ev.message});})();
</script></body></html>
